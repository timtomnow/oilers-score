name = "oilers-score-proxy"
main = "index.js"
compatibility_date = "2024-09-23"

# ── Environment variables ────────────────────────────────────────────────────
# Daily request cap before the worker returns 429.
# CF free tier is 100,000/day — this leaves comfortable headroom.
[vars]
DAILY_CAP = "50000"

# ── KV namespace ─────────────────────────────────────────────────────────────
# Create the namespace first:
#   npx wrangler kv namespace create RATE_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "17b52a4a60a04c76acbbd3c98deda715"
