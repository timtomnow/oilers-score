<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oilers Score</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00205B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oilers Score">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #00205B;
      min-height: 100vh;
      padding: 16px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }

    #app { max-width: 440px; margin: 0 auto; }

    /* ── Header ── */
    .header { text-align: center; padding: 20px 0 18px; }
    .logo-img { width: 68px; height: 68px; object-fit: contain; }
    .header h1 { color: #fff; font-size: 20px; font-weight: 700; margin-top: 8px; }
    .header .date { color: rgba(255,255,255,.55); font-size: 13px; margin-top: 3px; }

    /* ── Cards ── */
    .card { background: #fff; border-radius: 16px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.22); }
    .sec { padding: 14px 16px; }
    .sec + .sec { border-top: 1px solid #f2f2f2; }
    .sec-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #b0b0b0; margin-bottom: 10px; }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .b-live    { background: #ff3b30; color: #fff; }
    .b-final   { background: #e8e8ed; color: #555; }
    .b-preview { background: #34c759; color: #fff; }
    .b-off     { background: #e8e8ed; color: #666; }

    /* ── Score row ── */
    .score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .score-row { display: flex; align-items: center; justify-content: space-between; }
    .team-col { flex: 1; text-align: center; }
    .team-abbr { font-size: 12px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .score-num { font-size: 50px; font-weight: 800; color: #1c1c1e; line-height: 1; }
    .score-num.dim { color: #ccc; }
    .score-num.hi  { color: #FF4C00; }
    .score-dash { font-size: 30px; color: #ddd; font-weight: 300; padding: 0 6px; flex-shrink: 0; }
    .score-vs   { font-size: 16px; color: #ccc; padding: 0 12px; flex-shrink: 0; }
    .team-record { font-size: 11px; color: #c0c0c0; margin-top: 2px; }

    /* ── Period / situation ── */
    .period-clock { text-align: center; }
    .period-label { font-size: 20px; font-weight: 800; color: #1c1c1e; line-height: 1; }
    .period-time  { font-size: 13px; color: #888; margin-top: 3px; }
    .sog-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .sog-team { text-align: center; min-width: 52px; }
    .sog-num  { font-size: 26px; font-weight: 800; color: #1c1c1e; line-height: 1; }
    .sog-lbl  { font-size: 10px; color: #b0b0b0; text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }
    .sog-div  { font-size: 22px; color: #e0e0e0; font-weight: 300; }
    .situation { display: flex; align-items: center; justify-content: space-around; padding: 4px 0; }
    .sit-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .sit-label { font-size: 10px; color: #b0b0b0; text-transform: uppercase; letter-spacing: .4px; }
    .pp-badge { background: #FF4C00; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .4px; }

    /* ── Probable starters ── */
    .pitchers-row { display: flex; align-items: flex-start; justify-content: space-around; }
    .pitcher-col { flex: 1; text-align: center; }
    .pitcher-team { font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .pitcher-name { font-size: 14px; font-weight: 600; color: #1c1c1e; }
    .pitcher-sub  { font-size: 11px; color: #aaa; margin-top: 2px; }
    .vs-mid { display: flex; align-items: center; font-size: 12px; color: #ddd; font-weight: 600; padding: 14px 6px 0; }

    /* ── Decisions (goalie) ── */
    .decisions { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .dec-item { text-align: center; }
    .dec-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .dec-win  { color: #34c759; }
    .dec-loss { color: #ff3b30; }
    .dec-save { color: #ff9f0a; }
    .dec-name { font-size: 13px; font-weight: 600; color: #1c1c1e; }
    .dec-stat { font-size: 11px; color: #aaa; margin-top: 1px; }

    /* ── Period line score ── */
    .ls-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .ls-table { border-collapse: collapse; font-size: 12px; min-width: 100%; white-space: nowrap; }
    .ls-table th { color: #bbb; font-weight: 600; text-align: center; padding: 3px 6px; font-size: 11px; }
    .ls-table td { text-align: center; padding: 5px 6px; color: #666; }
    .ls-table td.ls-team { font-weight: 700; color: #1c1c1e; text-align: left; padding-right: 10px; min-width: 36px; }
    .ls-table td.ls-rhe { font-weight: 700; color: #FF4C00; border-left: 1px solid #f0f0f0; }
    .ls-table .cur { background: #fff4f0; border-radius: 4px; }

    /* ── Venue / broadcasts ── */
    .meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: #bbb; }
    .bc-pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .bc-pill { background: #f5f5f7; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; color: #555; }

    /* ── Season: record + streak ── */
    .record-row { display: flex; align-items: center; gap: 10px; }
    .record-big { font-size: 30px; font-weight: 800; color: #FF4C00; }
    .streak-pill { padding: 3px 11px; border-radius: 10px; font-size: 13px; font-weight: 700; }
    .s-w { background: #e6f9ed; color: #1b7a34; }
    .s-l { background: #ffeeed; color: #c0392b; }
    .rank-tag { font-size: 13px; color: #aaa; }

    /* ── Standings ── */
    .st-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .st-table th { color: #bbb; font-size: 11px; font-weight: 600; text-align: right; padding: 3px 0; }
    .st-table th:first-child { text-align: left; }
    .st-table td { padding: 7px 0; color: #666; text-align: right; border-top: 1px solid #f5f5f5; }
    .st-table td:first-child { text-align: left; font-weight: 600; color: #1c1c1e; }
    .st-table .oilers td { color: #FF4C00; font-weight: 700; }
    .st-table .oilers td:first-child { color: #FF4C00; }

    /* ── Footer ── */
    .footer { text-align: center; padding: 4px 0 8px; }
    .refresh-btn { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.25); padding: 10px 28px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .refresh-btn:active { background: rgba(255,255,255,.25); }
    .updated { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 8px; }
    .copyright { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; color: rgba(255,255,255,.3); margin-top: 8px; }
    .copyright a { color: rgba(255,255,255,.7); text-decoration: underline; text-underline-offset: 2px; }
    .copyright a:hover { color: #fff; }
    .help-btn { background: none; color: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.2); width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }
    .help-btn:active { color: #fff; border-color: rgba(255,255,255,.5); }

    /* ── README overlay ── */
    #readme-bd { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:300; opacity:0; pointer-events:none; transition:opacity .25s; }
    #readme-bd.open { opacity:1; pointer-events:auto; }
    #readme-sh { position:fixed; left:0; right:0; bottom:0; z-index:301; background:#fff; border-radius:20px 20px 0 0; max-height:90vh; display:flex; flex-direction:column; transform:translateY(102%); transition:transform .3s cubic-bezier(.25,.46,.45,.94); box-shadow:0 -8px 32px rgba(0,0,0,.2); }
    #readme-sh.open { transform:translateY(0); }
    .readme-head { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid #f0f0f0; flex-shrink:0; }
    .readme-title { font-size:15px; font-weight:700; color:#1c1c1e; }
    .readme-close { background:none; border:none; font-size:24px; color:#bbb; cursor:pointer; line-height:1; padding:0 0 2px 16px; }
    .readme-body { overflow-y:auto; flex:1; padding:16px; -webkit-overflow-scrolling:touch; line-height:1.6; font-size:13px; color:#444; }
    .readme-body h1 { font-size:18px; font-weight:800; color:#FF4C00; margin:0 0 12px; }
    .readme-body h2 { font-size:14px; font-weight:700; color:#1c1c1e; margin:16px 0 6px; border-bottom:1px solid #f0f0f0; padding-bottom:4px; }
    .readme-body p { margin:0 0 8px; }
    .readme-body ul { padding-left:18px; margin:0 0 8px; }
    .readme-body li { margin-bottom:3px; }
    .readme-body a { color:#FF4C00; }
    .readme-body strong { color:#1c1c1e; }
    .readme-body code { background:#f5f5f7; border-radius:4px; padding:1px 5px; font-size:12px; }

    /* ── States ── */
    .loading { color: #aaa; font-size: 14px; text-align: center; padding: 28px; }
    .err     { color: #ff3b30; font-size: 13px; text-align: center; padding: 20px; line-height: 1.5; }
    .off-msg { color: #888; font-size: 15px; text-align: center; padding: 8px 0 4px; }

    /* ── Collapsible sections ── */
    .sec-toggle-row { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
    .toggle-chev { color:#bbb; font-size:11px; transition:transform .25s; margin-left:6px; flex-shrink:0; }
    .toggle-chev.open { transform:rotate(180deg); }
    .coll-body { overflow:hidden; transition:max-height .3s ease; }

    /* ── Team toggle ── */
    .team-toggle { display:flex; gap:6px; margin-bottom:10px; }
    .team-btn { flex:1; padding:7px 0; border-radius:10px; border:none; font-size:12px; font-weight:600; cursor:pointer; background:#f0f0f5; color:#666; -webkit-tap-highlight-color:transparent; }
    .team-btn.active { background:#FF4C00; color:#fff; }

    /* ── Player stats table ── */
    .ps-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .ps-table { border-collapse:collapse; font-size:11px; white-space:nowrap; width:100%; }
    .ps-table th { color:#bbb; font-weight:600; padding:3px 4px; text-align:right; border-bottom:1px solid #f0f0f0; font-size:10px; }
    .ps-table th:first-child { text-align:left; min-width:72px; }
    .ps-table td { padding:4px 4px; color:#666; text-align:right; border-top:1px solid #f9f9f9; }
    .ps-table td:first-child { text-align:left; color:#1c1c1e; font-weight:500; }
    .ps-total td { border-top:1px solid #e8e8e8 !important; font-weight:700; color:#333; }
    .ps-sub { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#bbb; padding:8px 0 4px; }

    /* ── Play-by-play ── */
    .pbp-play { padding:7px 0; border-top:1px solid #f2f2f2; }
    .pbp-play:first-child { border-top:none; }
    .pbp-play-row { display:flex; align-items:flex-start; gap:6px; }
    .pbp-team-tag { font-size:10px; font-weight:800; letter-spacing:.5px; min-width:30px; padding-top:1px; flex-shrink:0; }
    .pbp-play-body { flex:1; }
    .pbp-inn { font-size:10px; color:#bbb; font-weight:700; letter-spacing:.3px; }
    .pbp-desc { font-size:12px; color:#444; line-height:1.4; margin-top:2px; }
    .pbp-goal .pbp-desc { font-weight:700; }
    .pbp-penalty .pbp-desc { font-weight:600; }
    .pbp-away-play .pbp-team-tag, .pbp-away-play .pbp-desc { color:#3b82f6; }
    .pbp-home-play .pbp-team-tag, .pbp-home-play .pbp-desc { color:#FF4C00; }
    .see-all-btn { display:block; text-align:center; color:#FF4C00; font-size:12px; font-weight:600; padding:8px 0 2px; cursor:pointer; background:none; border:none; width:100%; -webkit-tap-highlight-color:transparent; }

    /* ── Last 5 games list ── */
    .l5-row { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid #f2f2f2; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .l5-row:first-child { border-top:none; }
    .l5-left { flex:1; min-width:0; }
    .l5-opp { font-size:13px; font-weight:600; color:#1c1c1e; }
    .l5-meta { font-size:11px; color:#aaa; margin-top:1px; }
    .l5-result { font-size:12px; font-weight:700; padding:4px 9px; border-radius:8px; flex-shrink:0; }
    .l5-w   { background:#e6f9ed; color:#1b7a34; }
    .l5-l   { background:#ffeeed; color:#c0392b; }
    .l5-otl { background:#fff4e0; color:#b07800; }
    .l5-chev { color:#ddd; font-size:16px; flex-shrink:0; }

    /* ── Filter pills ── */
    .filter-row { display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; scrollbar-width:none; }
    .filter-row::-webkit-scrollbar { display:none; }
    .fpill { padding:5px 13px; border-radius:14px; font-size:12px; font-weight:600; cursor:pointer; border:none; background:#f0f0f5; color:#666; white-space:nowrap; flex-shrink:0; -webkit-tap-highlight-color:transparent; }
    .fpill.active { background:#FF4C00; color:#fff; }

    /* ── Overlay / bottom sheet ── */
    #ov-bd { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s; }
    #ov-bd.open { opacity:1; pointer-events:auto; }
    #ov-sh { position:fixed; left:0; right:0; bottom:0; z-index:201; background:#fff; border-radius:20px 20px 0 0; max-height:90vh; display:flex; flex-direction:column; transform:translateY(102%); transition:transform .3s cubic-bezier(.25,.46,.45,.94); box-shadow:0 -8px 32px rgba(0,0,0,.2); }
    #ov-sh.open { transform:translateY(0); }
    .ov-handle { width:36px; height:4px; background:#e0e0e0; border-radius:2px; margin:10px auto 0; flex-shrink:0; }
    .ov-head { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; flex-shrink:0; }
    .ov-title { font-size:15px; font-weight:700; color:#1c1c1e; }
    .ov-close { background:none; border:none; font-size:24px; color:#bbb; cursor:pointer; line-height:1; padding:0 0 2px 16px; }
    .ov-tabs { display:flex; border-bottom:1px solid #f0f0f0; flex-shrink:0; }
    .ov-tab { flex:1; padding:10px; font-size:13px; font-weight:600; background:none; border:none; cursor:pointer; color:#aaa; border-bottom:2px solid transparent; -webkit-tap-highlight-color:transparent; }
    .ov-tab.active { color:#FF4C00; border-bottom-color:#FF4C00; }
    .ov-body { overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
    .ov-sec { padding:14px 16px; }
    .ov-filter-wrap { position:sticky; top:0; background:#fff; padding:8px 16px 0; border-bottom:1px solid #f0f0f0; z-index:1; }

    /* ── Playoff button ── */
    .playoff-btn { display:block; width:100%; background:linear-gradient(135deg,#FF4C00,#ff6b2b); color:#fff; border:none; padding:12px 28px; border-radius:14px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:10px; letter-spacing:.3px; }
    .playoff-btn:active { opacity:.88; }

    /* ── Playoff sheet ── */
    #playoff-bd { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:300; opacity:0; pointer-events:none; transition:opacity .25s; }
    #playoff-bd.open { opacity:1; pointer-events:auto; }
    #playoff-sh { position:fixed; left:0; right:0; bottom:0; z-index:301; background:#fff; border-radius:20px 20px 0 0; max-height:90vh; display:flex; flex-direction:column; transform:translateY(102%); transition:transform .3s cubic-bezier(.25,.46,.45,.94); box-shadow:0 -8px 32px rgba(0,0,0,.2); }
    #playoff-sh.open { transform:translateY(0); }
    /* Bracket rows */
    .bp-block { background:#f9f9fb; border-radius:10px; padding:8px 10px; margin-bottom:10px; }
    .bp-series { display:flex; align-items:center; gap:8px; padding:5px 0; }
    .bp-letter { font-size:10px; font-weight:800; color:#ccc; letter-spacing:.5px; min-width:12px; flex-shrink:0; }
    .bp-team { font-size:14px; font-weight:700; color:#1c1c1e; }
    .bp-oilers { color:#FF4C00; }
    .bp-winner { color:#FF4C00; }
    .bp-loser { color:#ccc; font-weight:600; }
    .bp-score { font-size:12px; font-weight:700; color:#888; background:#fff; border-radius:6px; padding:2px 8px; flex-shrink:0; }
    .bp-tag { font-size:10px; color:#aaa; margin-left:auto; flex-shrink:0; }
    .bp-next { font-size:11px; color:#bbb; padding:5px 0 2px; border-top:1px dashed #e8e8e8; margin-top:3px; }
    .bp-round-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#bbb; margin:10px 0 6px; }
    .bp-tbd { font-size:13px; color:#ccc; font-style:italic; padding:4px 0; }

    /* ── Landscape adjustments ── */
    @media (orientation:landscape) and (max-height:500px) {
      body { padding:6px 16px 16px; }
      .header { padding:8px 0 6px; }
      .logo-img { width:40px; height:40px; }
      .header h1 { font-size:15px; margin-top:4px; }
      .score-num { font-size:36px; }
      #app { max-width:640px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <img class="logo-img"
      src="https://assets.nhle.com/logos/nhl/svg/EDM_light.svg"
      onerror="this.onerror=null;this.src='https://a.espncdn.com/i/teamlogos/nhl/500/edm.png'"
      alt="Edmonton Oilers">
    <h1>Edmonton Oilers</h1>
    <p class="date" id="date-label"></p>
  </header>

  <div id="playoff-btn-section"></div>

  <div id="game-section"><div class="card"><div class="loading">Loading…</div></div></div>
  <div id="season-section"></div>
  <div id="upcoming-section"></div>
  <div id="other-games-section"></div>

  <div class="footer">
    <button class="refresh-btn" onclick="load()">Refresh</button>
    <p class="updated" id="updated"></p>
    <p class="copyright">
      © 2026 <a href="https://github.com/timtomnow/oilers-score" target="_blank" rel="noopener">timtomnow</a>
      <button class="help-btn" onclick="openReadme()" aria-label="About this app">?</button>
    </p>
  </div>
</div>

<div id="readme-bd" onclick="closeReadme()"></div>
<div id="readme-sh">
  <div class="ov-handle"></div>
  <div class="readme-head">
    <div class="readme-title">About this app</div>
    <button class="readme-close" onclick="closeReadme()">&#x2715;</button>
  </div>
  <div class="readme-body" id="readme-body"><div class="loading">Loading…</div></div>
</div>

<div id="playoff-bd" onclick="closePlayoffSheet()"></div>
<div id="playoff-sh">
  <div class="ov-handle"></div>
  <div class="readme-head">
    <div class="readme-title">&#127942; Playoff Picture</div>
    <button class="readme-close" onclick="closePlayoffSheet()">&#x2715;</button>
  </div>
  <div class="ov-body" id="playoff-body"><div class="loading">Loading…</div></div>
</div>

<div id="ov-bd" onclick="closeOverlay()"></div>
<div id="ov-sh">
  <div class="ov-handle"></div>
  <div class="ov-head">
    <div class="ov-title" id="ov-title">Game Details</div>
    <button class="ov-close" onclick="closeOverlay()">&#x2715;</button>
  </div>
  <div class="ov-tabs" id="ov-tabs">
    <button class="ov-tab active" id="ov-tab-stats" onclick="setOvTab('stats')">Player Stats</button>
    <button class="ov-tab" id="ov-tab-plays" onclick="setOvTab('plays')">Play-by-Play</button>
  </div>
  <div class="ov-body" id="ov-body"></div>
</div>

<script>
  const TEAM_ABBREV     = CONFIG.TEAM_ABBREV;
  const TEAM_ID         = CONFIG.TEAM_ID;
  const DIVISION_ABBREV = CONFIG.DIVISION_ABBREV;
  const NHL_API_BASE    = CONFIG.NHL_API_BASE;

  // ── Helpers ──────────────────────────────────────────────────────────────

  const pad2 = n => String(n).padStart(2, '0');

  function localDate(d = new Date()) {
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }

  function daysAgo(n) {
    const d = new Date(); d.setDate(d.getDate() - n); return localDate(d);
  }

  function daysAhead(n) {
    const d = new Date(); d.setDate(d.getDate() + n); return localDate(d);
  }

  function fmtTime(utc) {
    if (!utc) return '';
    return new Date(utc).toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  }

  function periodLabel(num, type) {
    if (type === 'SO') return 'SO';
    if (type === 'OT' || num > 3) return 'OT';
    return num === 1 ? '1st' : num === 2 ? '2nd' : num === 3 ? '3rd' : `${num}th`;
  }

  function periodColLabel(num, type) {
    if (type === 'SO') return 'SO';
    if (type === 'OT' || num > 3) return 'OT';
    return `P${num}`;
  }

  function rankSuffix(n) {
    if (n == 1) return 'st'; if (n == 2) return 'nd'; if (n == 3) return 'rd'; return 'th';
  }

  function teamName(t) {
    if (!t) return '—';
    return (typeof t.name === 'object' ? t.name.default : t.name) ||
           (typeof t.placeName === 'object' ? t.placeName.default : t.placeName) ||
           t.abbrev || '—';
  }

  function teamAbbrev(t) {
    return t?.abbrev || '—';
  }

  // ── API ───────────────────────────────────────────────────────────────────

  async function get(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  async function fetchAllTodayGames(date) {
    const data = await get(`${NHL_API_BASE}/v1/schedule/${date}`);
    const dayEntry = (data.gameWeek ?? []).find(d => d.date === date) ?? (data.gameWeek ?? [])[0];
    return dayEntry?.games ?? [];
  }

  async function fetchTodayGames(date) {
    const games = await fetchAllTodayGames(date);
    return games.filter(g =>
      g.awayTeam?.abbrev === TEAM_ABBREV || g.homeTeam?.abbrev === TEAM_ABBREV
    );
  }

  function fetchPlayoffBracket() {
    const d = new Date();
    const year = d.getMonth() < 8 ? d.getFullYear() : d.getFullYear() + 1;
    return get(`${NHL_API_BASE}/v1/playoff-bracket/${year}`);
  }

  function fetchStandings() {
    return get(`${NHL_API_BASE}/v1/standings/now`);
  }

  function fetchClubSchedule() {
    return get(`${NHL_API_BASE}/v1/club-schedule-season/${TEAM_ABBREV}/now`);
  }

  async function fetchGameFeed(id) {
    const [boxscore, plays] = await Promise.all([
      get(`${NHL_API_BASE}/v1/gamecenter/${id}/boxscore`),
      get(`${NHL_API_BASE}/v1/gamecenter/${id}/play-by-play`),
    ]);
    return { boxscore, plays };
  }

  // ── Global state ─────────────────────────────────────────────────────────
  const loadedFeeds = {};
  const gameInfoCache = {};
  const ovState = { gameId: null, feed: null, tab: 'stats', filter: 'all', teamSide: 'away', periods: new Set() };

  // ── Collapsible toggle ────────────────────────────────────────────────────
  function toggleColl(id, rowEl) {
    const el = document.getElementById(id);
    if (!el) return;
    const chev = rowEl?.querySelector('.toggle-chev');
    const isOpen = el.style.maxHeight && el.style.maxHeight !== '0px';
    if (isOpen) {
      el.style.maxHeight = el.scrollHeight + 'px';
      requestAnimationFrame(() => { el.style.maxHeight = '0'; });
      if (chev) chev.classList.remove('open');
    } else {
      el.style.maxHeight = el.scrollHeight + 'px';
      if (chev) chev.classList.add('open');
      setTimeout(() => { if (el.style.maxHeight !== '0px') el.style.maxHeight = 'none'; }, 310);
    }
  }

  // ── Switch team stats (inline card) ───────────────────────────────────────
  function switchTeamStats(gameId, side) {
    const aw = document.getElementById(`ps-aw-${gameId}`);
    const hm = document.getElementById(`ps-hm-${gameId}`);
    const awBtn = document.getElementById(`ps-btn-aw-${gameId}`);
    const hmBtn = document.getElementById(`ps-btn-hm-${gameId}`);
    if (aw) aw.style.display = side === 'away' ? '' : 'none';
    if (hm) hm.style.display = side === 'home' ? '' : 'none';
    if (awBtn) awBtn.classList.toggle('active', side === 'away');
    if (hmBtn) hmBtn.classList.toggle('active', side === 'home');
    const coll = aw?.closest('.coll-body');
    if (coll && coll.style.maxHeight !== '0px') coll.style.maxHeight = 'none';
  }

  // ── Player stats renderer ─────────────────────────────────────────────────
  function renderPlayerStats(boxscore, side) {
    const team = boxscore?.playerByGameStats?.[side === 'away' ? 'awayTeam' : 'homeTeam'];
    if (!team) return '<div style="color:#aaa;font-size:13px;padding:8px 0">No stats available</div>';

    const skaters = [...(team.forwards ?? []), ...(team.defense ?? [])];
    const goalies = team.goalies ?? [];
    
    let html = '';
    if (skaters.length) {
      html += `<div class="ps-wrap"><table class="ps-table">
        <thead><tr><th>Skater</th><th>G</th><th>A</th><th>Pts</th><th>+/-</th><th>PIM</th><th>SOG</th><th>TOI</th></tr></thead>
        <tbody>`;
      for (const p of skaters) {

        const name = typeof p.name === 'object' ? p.name.default : (p.name ?? '');
        const last = name.split(' ').slice(1).join(' ') || name;
        const pos = p.position ?? '';
        const num = p.sweaterNumber != null ? `<span style="color:#bbb;font-size:10px;font-weight:700;margin-right:5px;display:inline-block;min-width:16px">${p.sweaterNumber}</span>` : '';
        html += `<tr><td>${num}${last}<span style="color:#bbb;font-size:9px;margin-left:3px">${pos}</span></td>
          <td>${p.goals ?? 0}</td><td>${p.assists ?? 0}</td><td>${p.points ?? 0}</td>
          <td>${p.plusMinus >= 0 ? '+' : ''}${p.plusMinus ?? 0}</td>
          <td>${p.pim ?? 0}</td><td>${p.sog ?? 0}</td><td>${p.toi ?? 0}</td></tr>`;
      }
      html += '</tbody></table></div>';
    }

    if (goalies.length) {
      html += `<div class="ps-sub">Goalies</div>
        <div class="ps-wrap"><table class="ps-table">
          <thead><tr><th>Goalie</th><th>SA</th><th>GA</th><th>SV</th><th>SV%</th></tr></thead>
          <tbody>`;
      for (const g of goalies) {
        const name = typeof g.name === 'object' ? g.name.default : (g.name ?? '');
        const last = name.split(' ').slice(1).join(' ') || name;
        const svPct = g.savePctg != null ? (g.savePctg * 100).toFixed(1) + '%' : '—';
        const num = g.sweaterNumber != null ? `<span style="color:#bbb;font-size:10px;font-weight:700;margin-right:5px;display:inline-block;min-width:16px">${g.sweaterNumber}</span>` : '';
        html += `<tr><td>${num}${last}${g.starter ? '<span style="color:#FF4C00;font-size:9px;margin-left:3px">★</span>' : ''}</td>
          <td>${g.shotsAgainst ?? '—'}</td><td>${g.goalsAgainst ?? '—'}</td>
          <td>${g.saves ?? '—'}</td><td>${svPct}</td></tr>`;
      }
      html += '</tbody></table></div>';
    }

    return html || '<div style="color:#aaa;font-size:13px;padding:8px 0">No stats available</div>';
  }

  // ── Build roster lookup from play-by-play rosterSpots ─────────────────────
  function buildRosterMap(rosterSpots) {
    const map = {};
    for (const p of rosterSpots ?? []) {
      map[p.playerId] = p;
    }
    return map;
  }

  function playerLastName(rosterMap, id) {
    if (!id) return null;
    const p = rosterMap[id];
    if (!p) return null;
    const ln = typeof p.lastName === 'object' ? p.lastName.default : p.lastName;
    return ln || null;
  }

  // ── Play formatter ────────────────────────────────────────────────────────
  function formatPlay(play, rosterMap) {
    const type = play.typeDescKey;
    const d = play.details ?? {};
    const time = play.timeInPeriod ?? '';

    if (type === 'goal') {
      const scorer = playerLastName(rosterMap, d.scoringPlayerId);
      const a1 = playerLastName(rosterMap, d.assist1PlayerId);
      const a2 = playerLastName(rosterMap, d.assist2PlayerId);
      const total = d.scoringPlayerTotal != null ? ` (${d.scoringPlayerTotal})` : '';
      let desc = `GOAL: ${scorer ?? 'Unknown'}${total}`;
      const assists = [a1, a2].filter(Boolean);
      if (assists.length) desc += ` from ${assists.join(', ')}`;
      desc += ` at ${time}`;
      if (d.awayScore != null && d.homeScore != null) desc += ` · ${d.awayScore}–${d.homeScore}`;
      return desc;
    }

    if (type === 'penalty') {
      const player = playerLastName(rosterMap, d.committedByPlayerId);
      const infraction = (d.descKey ?? '').replace(/-/g, ' ');
      const dur = d.duration;
      return `PENALTY: ${player ?? 'Unknown'} — ${infraction}${dur ? ` (${dur} min)` : ''} at ${time}`;
    }

    if (type === 'shot-on-goal') {
      const shooter = playerLastName(rosterMap, d.shootingPlayerId);
      return `Shot: ${shooter ?? 'Unknown'} at ${time}`;
    }

    if (type === 'blocked-shot') {
      const blocker = playerLastName(rosterMap, d.blockingPlayerId);
      return `Blocked shot: ${blocker ?? 'Unknown'} at ${time}`;
    }

    return null;
  }

  // ── Play-by-play renderer ─────────────────────────────────────────────────
  function renderPlays(plays, rosterMap, limit, filter, periods, teams) {
    if (!plays?.length) return '<div style="color:#aaa;font-size:13px;padding:12px 0;text-align:center">No plays yet</div>';

    let filtered = plays.filter(p => p.typeDescKey !== 'period-start' && p.typeDescKey !== 'period-end' && p.typeDescKey !== 'game-end' && p.typeDescKey !== 'stoppage' && p.typeDescKey !== 'faceoff');

    if (filter === 'goals')    filtered = filtered.filter(p => p.typeDescKey === 'goal');
    else if (filter === 'penalties') filtered = filtered.filter(p => p.typeDescKey === 'penalty');
    else if (filter === 'shots') filtered = filtered.filter(p => p.typeDescKey === 'shot-on-goal');

    if (periods?.size) {
      filtered = filtered.filter(p => periods.has(p.periodDescriptor?.number));
    }

    if (!filtered.length) return '<div style="color:#aaa;font-size:13px;padding:12px 0;text-align:center">No plays match this filter</div>';

    const slice = limit ? filtered.slice(-limit) : filtered;

    return [...slice].reverse().map(p => {
      const perNum = p.periodDescriptor?.number;
      const perType = p.periodDescriptor?.periodType;
      const perLabel = perNum ? periodLabel(perNum, perType) : '';
      const isGoal = p.typeDescKey === 'goal';
      const isPenalty = p.typeDescKey === 'penalty';
      const cls = isGoal ? ' pbp-goal' : isPenalty ? ' pbp-penalty' : '';
      const desc = formatPlay(p, rosterMap);
      if (!desc) return '';
      const teamId = p.details?.eventOwnerTeamId;
      const isAway = teams && teamId === teams.awayId;
      const isHome = teams && teamId === teams.homeId;
      const teamCls = isAway ? ' pbp-away-play' : isHome ? ' pbp-home-play' : '';
      const teamTag = isAway ? teams.awayAbbr : isHome ? teams.homeAbbr : '';
      return `<div class="pbp-play${cls}${teamCls}">
        <div class="pbp-play-row">
          <span class="pbp-team-tag">${teamTag}</span>
          <div class="pbp-play-body">
            <div class="pbp-inn">${perLabel}</div>
            <div class="pbp-desc">${desc}</div>
          </div>
        </div>
      </div>`;
    }).filter(Boolean).join('');
  }

  // ── Period line score ─────────────────────────────────────────────────────
  function periodLineScore(byPeriod, awAbbr, hmAbbr, livePerNum) {
    if (!byPeriod?.length) return '';
    return `
      <div class="ls-wrap">
        <table class="ls-table">
          <thead><tr>
            <th></th>
            ${byPeriod.map(p => `<th>${periodColLabel(p.period ?? p.periodDescriptor?.number, p.periodDescriptor?.periodType)}</th>`).join('')}
            <th class="ls-rhe">G</th>
          </tr></thead>
          <tbody>
            <tr>
              <td class="ls-team">${awAbbr}</td>
              ${byPeriod.map(p => {
                const cur = livePerNum === (p.period ?? p.periodDescriptor?.number) ? ' class="cur"' : '';
                return `<td${cur}>${p.away ?? '-'}</td>`;
              }).join('')}
              <td class="ls-rhe">${byPeriod.reduce((s,p) => s + (p.away ?? 0), 0)}</td>
            </tr>
            <tr>
              <td class="ls-team">${hmAbbr}</td>
              ${byPeriod.map(p => {
                const cur = livePerNum === (p.period ?? p.periodDescriptor?.number) ? ' class="cur"' : '';
                return `<td${cur}>${p.home ?? '-'}</td>`;
              }).join('')}
              <td class="ls-rhe">${byPeriod.reduce((s,p) => s + (p.home ?? 0), 0)}</td>
            </tr>
          </tbody>
        </table>
      </div>`;
  }

  // ── Broadcasts ────────────────────────────────────────────────────────────
  function broadcasts(list) {
    if (!list?.length) return '';
    const pills = list.slice(0, 5)
      .map(b => b.network || b.name).filter(Boolean)
      .map(n => `<span class="bc-pill">${n}</span>`).join('');
    return pills ? `<div class="bc-pills">${pills}</div>` : '';
  }

  // ── Overlay ───────────────────────────────────────────────────────────────
  async function openGameOverlay(gameId, tab) {
    ovState.gameId = gameId;
    ovState.tab = tab || 'stats';
    ovState.filter = 'all';
    ovState.teamSide = 'away';
    ovState.periods = new Set();

    const info = gameInfoCache[gameId];
    document.getElementById('ov-title').textContent = info?.title ?? 'Game Details';
    document.getElementById('ov-body').innerHTML = '<div class="loading" style="padding:40px">Loading…</div>';

    document.getElementById('ov-bd').classList.add('open');
    document.getElementById('ov-sh').classList.add('open');
    document.body.style.overflow = 'hidden';

    if (!loadedFeeds[gameId]) {
      try { loadedFeeds[gameId] = await fetchGameFeed(gameId); }
      catch(e) {
        document.getElementById('ov-body').innerHTML = `<div class="err" style="padding:20px">Could not load game data.<br>${e.message}</div>`;
        return;
      }
    }
    ovState.feed = loadedFeeds[gameId];
    renderOvContent();
  }

  function closeOverlay() {
    document.getElementById('ov-bd').classList.remove('open');
    document.getElementById('ov-sh').classList.remove('open');
    document.body.style.overflow = '';
  }

  function setOvTab(tab) { ovState.tab = tab; renderOvContent(); }
  function setOvFilter(f) { ovState.filter = f; renderOvContent(); }
  function setOvPeriod(p) {
    if (ovState.periods.has(p)) ovState.periods.delete(p);
    else ovState.periods.add(p);
    renderOvContent();
  }
  function setOvTeam(side) { ovState.teamSide = side; renderOvContent(); }

  function renderOvContent() {
    document.getElementById('ov-tab-stats').classList.toggle('active', ovState.tab === 'stats');
    document.getElementById('ov-tab-plays').classList.toggle('active', ovState.tab === 'plays');

    const feed = ovState.feed;
    const boxscore = feed?.boxscore;
    const playsData = feed?.plays;
    const rosterMap = buildRosterMap(playsData?.rosterSpots);
    const allPlays = playsData?.plays ?? [];

    let html = '';
    if (ovState.tab === 'stats') {
      const awAb = boxscore?.awayTeam?.abbrev || 'Away';
      const hmAb = boxscore?.homeTeam?.abbrev || 'Home';
      html = `<div class="ov-sec">
        <div class="team-toggle">
          <button class="team-btn ${ovState.teamSide === 'away' ? 'active' : ''}" onclick="setOvTeam('away')">${awAb}</button>
          <button class="team-btn ${ovState.teamSide === 'home' ? 'active' : ''}" onclick="setOvTeam('home')">${hmAb}</button>
        </div>
        ${renderPlayerStats(boxscore, ovState.teamSide)}
      </div>`;
    } else {
      const filters = [
        { id:'all', label:'All' },
        { id:'goals', label:'Goals' },
        { id:'penalties', label:'Penalties' },
        { id:'shots', label:'Shots' },
      ];
      const typePills = filters.map(f =>
        `<button class="fpill ${f.id === ovState.filter ? 'active' : ''}" onclick="setOvFilter('${f.id}')">${f.label}</button>`
      ).join('');

      const availPeriods = [...new Set(allPlays.map(p => p.periodDescriptor?.number).filter(Boolean))].sort((a,b) => a-b);
      const periodPills = availPeriods.map(p => {
        const lbl = periodLabel(p, allPlays.find(x => x.periodDescriptor?.number === p)?.periodDescriptor?.periodType);
        return `<button class="fpill ${ovState.periods.has(p) ? 'active' : ''}" onclick="setOvPeriod(${p})">${lbl}</button>`;
      }).join('');

      html = `<div class="ov-filter-wrap">
          <div class="filter-row" style="padding-bottom:6px">${typePills}</div>
          ${periodPills ? `<div style="display:flex;align-items:center;gap:6px;padding-bottom:10px">
            <span style="font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0">Per</span>
            <div class="filter-row" style="padding:0">${periodPills}</div>
          </div>` : ''}
        </div>
        <div class="ov-sec">${renderPlays(allPlays, rosterMap, 0, ovState.filter, ovState.periods, boxscore ? { awayId: boxscore.awayTeam?.id, homeId: boxscore.homeTeam?.id, awayAbbr: boxscore.awayTeam?.abbrev || 'AWY', homeAbbr: boxscore.homeTeam?.abbrev || 'HME' } : null)}</div>`;
    }
    document.getElementById('ov-body').innerHTML = html;
  }

  // ── Game card ─────────────────────────────────────────────────────────────
  function renderGame(g, feed) {
    const state = g.gameState;
    const isPreview = state === 'FUT' || state === 'PRE';
    const isLive    = state === 'LIVE' || state === 'CRIT';
    const isFinal   = state === 'FINAL' || state === 'OFF';

    const aw = g.awayTeam;
    const hm = g.homeTeam;
    const awAbbr = teamAbbrev(aw);
    const hmAbbr = teamAbbrev(hm);

    const awScore = isPreview ? '—' : (aw?.score ?? 0);
    const hmScore = isPreview ? '—' : (hm?.score ?? 0);

    const awWon = isFinal && aw?.score > hm?.score;
    const hmWon = isFinal && hm?.score > aw?.score;

    let badgeCls = 'b-off', badgeTxt = state ?? '—';
    if (isLive)    { badgeCls = 'b-live'; badgeTxt = 'Live'; }
    if (isFinal)   { badgeCls = 'b-final'; badgeTxt = 'Final'; }
    if (isPreview) { badgeCls = 'b-preview'; badgeTxt = 'Scheduled'; }

    const perNum  = g.period ?? g.periodDescriptor?.number;
    const perType = g.periodDescriptor?.periodType;
    const clock   = g.clock;

    // ── Score header ──
    let html = `<div class="sec">
      <div class="score-header">
        <span class="badge ${badgeCls}">${badgeTxt}</span>
        ${isLive && perNum ? `<span style="font-size:13px;color:#888;font-weight:600">${periodLabel(perNum, perType)}</span>` : ''}
        ${isPreview ? `<span style="font-size:13px;font-weight:600;color:#333">${fmtTime(g.startTimeUTC)}</span>` : ''}
        ${isFinal && g.gameOutcome?.lastPeriodType && g.gameOutcome.lastPeriodType !== 'REG' ? `<span style="font-size:12px;color:#888">/ ${g.gameOutcome.lastPeriodType}</span>` : ''}
      </div>
      <div class="score-row">
        <div class="team-col">
          <div class="team-abbr">${awAbbr}</div>
          <div class="score-num ${isFinal && awWon ? 'hi' : isFinal && !awWon ? 'dim' : ''}">${awScore}</div>
        </div>
        ${isPreview ? `<span class="score-vs">vs</span>` : `<span class="score-dash">–</span>`}
        <div class="team-col">
          <div class="team-abbr">${hmAbbr}</div>
          <div class="score-num ${isFinal && hmWon ? 'hi' : isFinal && !hmWon ? 'dim' : ''}">${hmScore}</div>
        </div>
      </div>
    </div>`;

    // ── Live: period clock + shots ──
    if (isLive) {
      const timeRemaining = clock?.timeRemaining ?? '';
      const inIntermission = clock?.inIntermission ?? false;
      const awSOG = feed?.boxscore?.homeTeam?.sog ?? 0;
      const hmSOG = feed?.boxscore?.awayTeam?.sog ?? 0;

      let clockLabel = '';
      if (inIntermission) {
        clockLabel = `Intermission`;
      } else if (timeRemaining) {
        clockLabel = `${timeRemaining} remaining`;
      }

      html += `<div class="sec">
        <div class="situation">
          <div class="sit-col">
            <div class="sog-row">
              <div class="sog-team">
                <div class="sog-num">${awSOG}</div>
                <div class="sog-lbl">${awAbbr}</div>
              </div>
              <div class="sog-div">·</div>
              <div class="sog-team">
                <div class="sog-num">${hmSOG}</div>
                <div class="sog-lbl">${hmAbbr}</div>
              </div>
            </div>
            <span class="sit-label">Shots on Goal</span>
          </div>
          <div class="sit-col">
            <div class="period-clock">
              <div class="period-label">${periodLabel(perNum, perType)}</div>
              ${clockLabel ? `<div class="period-time">${clockLabel}</div>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }

    // ── Period line score (live + final from boxscore) ──
    const byPeriod = feed?.boxscore?.linescore?.byPeriod ?? [];
    if ((isLive || isFinal) && byPeriod.length) {
      html += `<div class="sec">
        <div class="sec-title">Period Scores</div>
        ${periodLineScore(byPeriod, awAbbr, hmAbbr, isLive ? perNum : null)}
      </div>`;
    }

    // ── Goalie decisions (final) ──
    if (isFinal && feed?.boxscore) {
      const bs = feed.boxscore;
      const awGoalies = bs.playerByGameStats?.awayTeam?.goalies ?? [];
      const hmGoalies = bs.playerByGameStats?.homeTeam?.goalies ?? [];
      const allGoalies = [...awGoalies, ...hmGoalies];
      const winner = allGoalies.find(g => g.decision === 'W');
      const loser  = allGoalies.find(g => g.decision === 'L');
      if (winner || loser) {
        const items = [
          winner && `<div class="dec-item">
            <div class="dec-type dec-win">Win</div>
            <div class="dec-name">${(typeof winner.name === 'object' ? winner.name.default : winner.name ?? '').split(' ').slice(1).join(' ') || ''}</div>
            <div class="dec-stat">${winner.saves ?? ''}sv ${winner.goalsAgainst ?? ''}ga</div>
          </div>`,
          loser && `<div class="dec-item">
            <div class="dec-type dec-loss">Loss</div>
            <div class="dec-name">${(typeof loser.name === 'object' ? loser.name.default : loser.name ?? '').split(' ').slice(1).join(' ') || ''}</div>
            <div class="dec-stat">${loser.saves ?? ''}sv ${loser.goalsAgainst ?? ''}ga</div>
          </div>`,
        ].filter(Boolean).join('');
        if (items) html += `<div class="sec"><div class="decisions">${items}</div></div>`;
      }
    }

    // ── Player stats (live + final) ──
    if ((isLive || isFinal) && feed?.boxscore?.playerByGameStats) {
      const collId = `coll-ps-${g.id}`;
      html += `<div class="sec">
        <div class="sec-toggle-row" onclick="toggleColl('${collId}', this)">
          <span class="sec-title" style="margin-bottom:0">Player Stats</span>
          <span class="toggle-chev">▼</span>
        </div>
        <div id="${collId}" class="coll-body" style="max-height:0">
          <div style="padding-top:10px;padding-bottom:4px">
            <div class="team-toggle">
              <button class="team-btn active" id="ps-btn-aw-${g.id}" onclick="switchTeamStats(${g.id},'away')">${awAbbr}</button>
              <button class="team-btn" id="ps-btn-hm-${g.id}" onclick="switchTeamStats(${g.id},'home')">${hmAbbr}</button>
            </div>
            <div id="ps-aw-${g.id}">${renderPlayerStats(feed.boxscore, 'away')}</div>
            <div id="ps-hm-${g.id}" style="display:none">${renderPlayerStats(feed.boxscore, 'home')}</div>
          </div>
        </div>
      </div>`;
    }

    // ── Play-by-play (live: last 5 inline + see all; final: link only) ──
    if (isLive && feed?.plays?.plays?.length) {
      const rosterMap = buildRosterMap(feed.plays.rosterSpots);
      const collId2 = `coll-pbp-${g.id}`;
      html += `<div class="sec">
        <div class="sec-toggle-row" onclick="toggleColl('${collId2}', this)">
          <span class="sec-title" style="margin-bottom:0">Recent Plays</span>
          <span class="toggle-chev">▼</span>
        </div>
        <div id="${collId2}" class="coll-body" style="max-height:0">
          <div style="padding-top:4px">
            ${renderPlays(feed.plays.plays, rosterMap, 5, 'all', null, { awayId: g.awayTeam?.id, homeId: g.homeTeam?.id, awayAbbr: awAbbr, homeAbbr: hmAbbr })}
            <button class="see-all-btn" onclick="openGameOverlay(${g.id},'plays')">See all plays →</button>
          </div>
        </div>
      </div>`;
    } else if (isFinal && feed?.plays?.plays?.length) {
      html += `<div class="sec">
        <button class="see-all-btn" onclick="openGameOverlay(${g.id},'plays')">View Play-by-Play →</button>
      </div>`;
    }

    // ── Venue + broadcasts ──
    const venue = typeof g.venue === 'object' ? g.venue.default : g.venue;
    const bcHtml = broadcasts(g.tvBroadcasts);
    if (venue || bcHtml) {
      html += `<div class="sec">
        <div class="meta">
          <span>${venue ?? ''}</span>
          ${bcHtml}
        </div>
      </div>`;
    }

    return `<div class="card">${html}</div>`;
  }

  // ── Season card ───────────────────────────────────────────────────────────
  function renderSeason(standings) {
    if (!standings?.standings) return '';

    const divTeams = standings.standings
      .filter(r => r.divisionAbbrev === DIVISION_ABBREV)
      .sort((a, b) => (a.divisionSequence ?? 99) - (b.divisionSequence ?? 99));

    const oilersRec = divTeams.find(r => r.teamAbbrev?.default === TEAM_ABBREV || r.teamAbbrev === TEAM_ABBREV);

    let html = '';

    if (oilersRec) {
      const streak = oilersRec.streakCode ?? '';
      const sCls = streak.startsWith('W') ? 's-w' : 's-l';
      const rank = oilersRec.divisionSequence ?? '—';
      const otl  = oilersRec.otLosses ?? 0;
      html += `<div class="sec">
        <div class="sec-title">${new Date().getFullYear()} Season</div>
        <div class="record-row">
          <span class="record-big">${oilersRec.wins}–${oilersRec.losses}–${otl}</span>
          <span class="rank-tag">${rank}${rankSuffix(rank)} Pacific · ${oilersRec.points ?? ''}pts</span>
        </div>
      </div>`;
    }

    if (divTeams.length) {
      const rows = divTeams.map(r => {
        const abbrev = r.teamAbbrev?.default ?? r.teamAbbrev ?? '—';
        const isOilers = abbrev === TEAM_ABBREV;
        const otl = r.otLosses ?? 0;
        return `<tr${isOilers ? ' class="oilers"' : ''}>
          <td>${r.teamCommonName?.default ?? r.teamName?.default ?? abbrev}</td>
          <td>${r.wins ?? '—'}</td>
          <td>${r.losses ?? '—'}</td>
          <td>${otl}</td>
          <td>${r.points ?? '—'}</td>
        </tr>`;
      }).join('');
      html += `<div class="sec">
        <div class="sec-title">Pacific Division</div>
        <table class="st-table">
          <thead><tr><th>Team</th><th>W</th><th>L</th><th>OT</th><th>PTS</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    return html ? `<div class="card">${html}</div>` : '';
  }

  // ── Bottom card: Last 5 + Upcoming ───────────────────────────────────────
  function renderBottomCard(clubSchedule) {
    const today = localDate();
    const all = clubSchedule?.games ?? clubSchedule?.clubSchedule ?? [];

    const completed = all
      .filter(g => (g.gameState === 'FINAL' || g.gameState === 'OFF') && (g.gameDate ?? '') < today)
      .sort((a, b) => (a.gameDate ?? '') < (b.gameDate ?? '') ? -1 : 1);
    const last5 = completed.slice(-5);

    const upcoming = all
      .filter(g => (g.gameState === 'FUT' || g.gameState === 'PRE') && (g.gameDate ?? '') > today)
      .sort((a, b) => (a.gameDate ?? '') < (b.gameDate ?? '') ? -1 : 1)
      .slice(0, 3);

    // Cache game titles for overlay
    for (const gm of last5) {
      const aw = gm.awayTeam, hm = gm.homeTeam;
      const isAway = aw?.abbrev === TEAM_ABBREV;
      const opp = isAway ? hm?.abbrev : aw?.abbrev;
      const d = new Date((gm.gameDate ?? '') + 'T12:00:00');
      const dateStr = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
      gameInfoCache[gm.id] = {
        title: `${isAway ? 'EDM @ ' + opp : opp + ' @ EDM'} · ${dateStr}`,
      };
    }

    let html = '';

    // ── Last 5 games ──
    if (last5.length) {
      const rows = [...last5].reverse().map(gm => {
        const aw = gm.awayTeam, hm = gm.homeTeam;
        const isAway = aw?.abbrev === TEAM_ABBREV;
        const oilScore = isAway ? aw?.score : hm?.score;
        const oppScore = isAway ? hm?.score : aw?.score;
        const opp = isAway ? hm : aw;
        const oppName = typeof opp?.commonName === 'object' ? opp.commonName.default : (opp?.placeName?.default ?? opp?.abbrev ?? '—');
        const ha = isAway ? '@ ' : 'vs ';
        const d = new Date((gm.gameDate ?? '') + 'T12:00:00');
        const dateStr = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
        const win = oilScore > oppScore;
        const lastPeriod = gm.gameOutcome?.lastPeriodType ?? 'REG';
        const suffix = lastPeriod !== 'REG' ? ` ${lastPeriod}` : '';
        const isOTL = !win && lastPeriod !== 'REG';
        const resCls = win ? 'l5-w' : isOTL ? 'l5-otl' : 'l5-l';
        const resLabel = `${win ? 'W' : isOTL ? 'OTL' : 'L'} ${oilScore}–${oppScore}${suffix}`;
        return `<div class="l5-row" onclick="openGameOverlay(${gm.id},'stats')">
          <div class="l5-left">
            <div class="l5-opp">${ha}${oppName}</div>
            <div class="l5-meta">${dateStr}</div>
          </div>
          <div class="l5-result ${resCls}">${resLabel}</div>
          <span class="l5-chev">›</span>
        </div>`;
      }).join('');
      html += `<div class="sec">
        <div class="sec-title">Last 5 Games</div>
        ${rows}
      </div>`;
    }

    // ── Upcoming games ──
    if (upcoming.length) {
      const upRows = upcoming.map(gm => {
        const aw = gm.awayTeam, hm = gm.homeTeam;
        const isAway = aw?.abbrev === TEAM_ABBREV;
        const opp = isAway ? hm : aw;
        const oppName = typeof opp?.commonName === 'object' ? opp.commonName.default : (opp?.placeName?.default ?? opp?.abbrev ?? '—');
        const ha = isAway ? '@ ' : 'vs ';
        const d = new Date((gm.gameDate ?? '') + 'T12:00:00');
        const dateStr = d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
        const timeStr = fmtTime(gm.startTimeUTC);
        return `<div class="sec">
          <div style="font-size:13px;font-weight:700;color:#1c1c1e">${ha}${oppName}</div>
          <div style="font-size:11px;color:#aaa;margin-top:2px">${dateStr}${timeStr ? ' · ' + timeStr : ''}</div>
        </div>`;
      }).join('');
      html += `<div class="sec" style="padding-bottom:4px"><div class="sec-title">Upcoming Games</div></div>${upRows}`;
    }

    return html ? `<div class="card">${html}</div>` : '';
  }

  // ── Other NHL Games Today ─────────────────────────────────────────────────
  function renderOtherGames(allGames) {
    const others = allGames.filter(g =>
      g.awayTeam?.abbrev !== TEAM_ABBREV && g.homeTeam?.abbrev !== TEAM_ABBREV
    );
    if (!others.length) return '';

    for (const g of others) {
      gameInfoCache[g.id] = { title: `${g.awayTeam?.abbrev ?? '—'} @ ${g.homeTeam?.abbrev ?? '—'}` };
    }

    const rows = others.map(g => {
      const state = g.gameState;
      const isLive    = state === 'LIVE' || state === 'CRIT';
      const isFinal   = state === 'FINAL' || state === 'OFF';
      const awAbbr = g.awayTeam?.abbrev ?? '—';
      const hmAbbr = g.homeTeam?.abbrev ?? '—';
      const awScore = g.awayTeam?.score ?? 0;
      const hmScore = g.homeTeam?.score ?? 0;

      let rightHtml, metaHtml = '';
      if (isLive) {
        const perNum  = g.period ?? g.periodDescriptor?.number;
        const perType = g.periodDescriptor?.periodType;
        const clock   = g.clock?.timeRemaining ?? '';
        const inInt   = g.clock?.inIntermission;
        const perLbl  = perNum ? periodLabel(perNum, perType) : 'Live';
        const clockLbl = inInt ? 'INT' : clock;
        metaHtml = `<div class="l5-meta">${perLbl}${clockLbl ? ' · ' + clockLbl : ''}</div>`;
        rightHtml = `<div class="l5-result b-live">${awScore}–${hmScore}</div>`;
      } else if (isFinal) {
        const ot = g.gameOutcome?.lastPeriodType;
        const suffix = ot && ot !== 'REG' ? `/${ot}` : '';
        metaHtml = `<div class="l5-meta">Final${suffix}</div>`;
        rightHtml = `<div class="l5-result b-final">${awScore}–${hmScore}</div>`;
      } else {
        rightHtml = `<div class="l5-result b-preview">${fmtTime(g.startTimeUTC)}</div>`;
      }

      return `<div class="l5-row" onclick="openGameOverlay(${g.id},'stats')">
        <div class="l5-left">
          <div class="l5-opp">${awAbbr} @ ${hmAbbr}</div>
          ${metaHtml}
        </div>
        ${rightHtml}
        <span class="l5-chev">›</span>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="sec">
        <div class="sec-title">Other NHL Games Today</div>
        ${rows}
      </div>
    </div>`;
  }

  // ── Playoff Picture ───────────────────────────────────────────────────────
  const playoffCache = { data: null };

  async function openPlayoffSheet() {
    document.getElementById('playoff-bd').classList.add('open');
    document.getElementById('playoff-sh').classList.add('open');
    document.body.style.overflow = 'hidden';
    if (playoffCache.data) { renderPlayoffContent(playoffCache.data); return; }
    document.getElementById('playoff-body').innerHTML = '<div class="loading" style="padding:40px">Loading…</div>';
    try {
      playoffCache.data = await fetchPlayoffBracket();
      renderPlayoffContent(playoffCache.data);
    } catch(e) {
      document.getElementById('playoff-body').innerHTML = `<div class="err" style="padding:20px">Could not load playoff data.<br>${e.message}</div>`;
    }
  }

  function closePlayoffSheet() {
    document.getElementById('playoff-bd').classList.remove('open');
    document.getElementById('playoff-sh').classList.remove('open');
    document.body.style.overflow = '';
  }

  function renderPlayoffContent(bracket) {
    const allSeries = bracket?.series ?? [];
    if (!allSeries.length) {
      document.getElementById('playoff-body').innerHTML = '<div style="color:#aaa;font-size:14px;padding:40px;text-align:center">Playoff bracket not yet available.</div>';
      return;
    }

    const byLetter = {};
    for (const s of allSeries) byLetter[s.seriesLetter] = s;

    // Standard NHL bracket: which two R1 series feed each R2 slot
    // A+B→I, C+D→J (East); E+F→K, G+H→L (West); I+J→M, K+L→N; M+N→O
    const pairOf = { A:'B',B:'A', C:'D',D:'C', E:'F',F:'E', G:'H',H:'G', I:'J',J:'I', K:'L',L:'K', M:'N',N:'M' };
    const feedsTo = { A:'I',B:'I', C:'J',D:'J', E:'K',F:'K', G:'L',H:'L', I:'M',J:'M', K:'N',L:'N', M:'O',N:'O' };

    function seriesWinner(letter) {
      const s = byLetter[letter];
      if (!s) return null;
      if ((s.topSeedWins ?? 0) === 4) return s.topSeedTeam?.abbrev ?? null;
      if ((s.bottomSeedWins ?? 0) === 4) return s.bottomSeedTeam?.abbrev ?? null;
      return null;
    }

    function seriesRow(letter) {
      const s = byLetter[letter];
      const top = s?.topSeedTeam, bot = s?.bottomSeedTeam;
      if (!s || (!top && !bot)) return `<div class="bp-series"><span class="bp-letter">${letter}</span><span class="bp-tbd">TBD</span></div>`;
      const topW = s.topSeedWins ?? 0, botW = s.bottomSeedWins ?? 0;
      const topDone = topW === 4, botDone = botW === 4;
      const topAbbr = top?.abbrev ?? '—', botAbbr = bot?.abbrev ?? '—';
      const topCls = topAbbr === TEAM_ABBREV ? 'bp-oilers' : topDone ? 'bp-winner' : botDone ? 'bp-loser' : '';
      const botCls = botAbbr === TEAM_ABBREV ? 'bp-oilers' : botDone ? 'bp-winner' : topDone ? 'bp-loser' : '';
      let tag = '';
      if (topDone) tag = `${topAbbr} wins`;
      else if (botDone) tag = `${botAbbr} wins`;
      else if (topW > botW) tag = `${topAbbr} leads ${topW}-${botW}`;
      else if (botW > topW) tag = `${botAbbr} leads ${botW}-${topW}`;
      else if (topW > 0) tag = `Tied ${topW}-${botW}`;
      return `<div class="bp-series">
        <span class="bp-letter">${letter}</span>
        <span class="bp-team ${topCls}">${topAbbr}</span>
        <span class="bp-score">${topW}–${botW}</span>
        <span class="bp-team ${botCls}">${botAbbr}</span>
        ${tag ? `<span class="bp-tag">${tag}</span>` : ''}
      </div>`;
    }

    function pairBlock(lA, lB) {
      const wA = seriesWinner(lA), wB = seriesWinner(lB);
      let nextTxt;
      if (wA && wB) nextTxt = `→ ${wA} vs ${wB} in Round 2`;
      else if (wA) nextTxt = `→ ${wA} meets winner of ${lB}`;
      else if (wB) nextTxt = `→ Winner of ${lA} meets ${wB}`;
      else nextTxt = `→ Winners advance to Round 2`;
      return `<div class="bp-block">${seriesRow(lA)}${seriesRow(lB)}<div class="bp-next">${nextTxt}</div></div>`;
    }

    function hasTeams(letter) {
      const s = byLetter[letter];
      return !!(s?.topSeedTeam || s?.bottomSeedTeam);
    }

    function confSection(title, lA, lB, lC, lD, lR2a, lR2b, lCF) {
      let h = `<div class="ov-sec"><div class="sec-title">${title}</div>`;
      h += `<div class="bp-round-lbl">First Round</div>`;
      h += pairBlock(lA, lB);
      h += pairBlock(lC, lD);
      if (hasTeams(lR2a) || hasTeams(lR2b)) {
        h += `<div class="bp-round-lbl">Second Round</div>`;
        h += seriesRow(lR2a) + seriesRow(lR2b);
      }
      if (hasTeams(lCF)) {
        h += `<div class="bp-round-lbl">Conference Finals</div>`;
        h += seriesRow(lCF);
      } else {
        const wA = seriesWinner(lR2a), wB = seriesWinner(lR2b);
        if (wA || wB) {
          const txt = wA && wB ? `${wA} vs ${wB}` : wA ? `${wA} vs TBD` : `TBD vs ${wB}`;
          h += `<div class="bp-round-lbl">Conference Finals</div><div class="bp-series"><span class="bp-tbd">${txt}</span></div>`;
        }
      }
      return h + `</div>`;
    }

    let html = confSection('Eastern Conference', 'A','B','C','D','I','J','M');
    html += confSection('Western Conference', 'E','F','G','H','K','L','N');

    html += `<div class="ov-sec" style="border-top:2px solid #FF4C00"><div class="sec-title" style="color:#FF4C00">Stanley Cup Final</div>`;
    if (hasTeams('O')) {
      html += seriesRow('O');
    } else {
      const wM = seriesWinner('M'), wN = seriesWinner('N');
      const txt = wM && wN ? `${wM} vs ${wN}` : wM ? `${wM} vs TBD` : wN ? `TBD vs ${wN}` : 'TBD';
      html += `<div class="bp-series"><span class="bp-tbd">${txt}</span></div>`;
    }
    html += `</div>`;

    document.getElementById('playoff-body').innerHTML = html;
  }

  // ── Main load ─────────────────────────────────────────────────────────────
  async function load() {
    const gameEl   = document.getElementById('game-section');
    const seasonEl = document.getElementById('season-section');
    gameEl.innerHTML = '<div class="card"><div class="loading">Loading…</div></div>';

    document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-CA', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    try {
      const today = localDate();
      const [allTodayGames, standingsData, clubData, bracketData] = await Promise.all([
        fetchAllTodayGames(today).catch(() => []),
        fetchStandings().catch(() => null),
        fetchClubSchedule().catch(() => null),
        fetchPlayoffBracket().catch(() => null),
      ]);
      const games = allTodayGames.filter(g =>
        g.awayTeam?.abbrev === TEAM_ABBREV || g.homeTeam?.abbrev === TEAM_ABBREV
      );

      // Fetch feeds for live and final games
      const feedGames = games.filter(g => ['LIVE','CRIT','FINAL','OFF'].includes(g.gameState));
      const feedResults = await Promise.all(feedGames.map(g => fetchGameFeed(g.id).catch(() => null)));
      feedGames.forEach((g, i) => { if (feedResults[i]) loadedFeeds[g.id] = feedResults[i]; });
      const feedMap = Object.fromEntries(feedGames.map((g, i) => [g.id, feedResults[i]]));

      if (!games.length) {
        gameEl.innerHTML = `<div class="card">
          <div class="sec">
            <span class="badge b-off">Off Day</span>
            <div class="off-msg">No game today. Go Oilers!</div>
          </div>
        </div>`;
      } else {
        gameEl.innerHTML = games.map(g => renderGame(g, feedMap[g.id] ?? null)).join('');
      }

      seasonEl.innerHTML = renderSeason(standingsData);
      document.getElementById('upcoming-section').innerHTML = renderBottomCard(clubData);
      document.getElementById('other-games-section').innerHTML = renderOtherGames(allTodayGames);

      const hasPlayoffs = (bracketData?.series?.length ?? 0) > 0;
      if (hasPlayoffs) { playoffCache.data = bracketData; }
      document.getElementById('playoff-btn-section').innerHTML = hasPlayoffs
        ? `<button class="playoff-btn" onclick="openPlayoffSheet()">&#127942; Playoff Picture</button>`
        : '';

      document.getElementById('updated').textContent =
        'Updated at ' + new Date().toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' });

    } catch(e) {
      gameEl.innerHTML = `<div class="card"><div class="err">Could not load data.<br>${e.message}</div></div>`;
    }
  }

  // ── README overlay ────────────────────────────────────────────────────────
  function githubRawUrl() {
    const { hostname, pathname } = window.location;
    if (hostname.endsWith('.github.io')) {
      const user = hostname.replace('.github.io', '');
      const repo = pathname.split('/').filter(Boolean)[0] ?? '';
      if (repo) return `https://raw.githubusercontent.com/${user}/${repo}/main/README.md`;
    }
    return null;
  }

  function parseMarkdown(md) {
    return md
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>[\s\S]*?<\/li>)(\n(?!<li>))/g, '<ul>$1</ul>\n')
      .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
      .replace(/\n\n+/g, '</p><p>')
      .replace(/^(?!<[hup])/gm, '')
      .replace(/<\/ul><ul>/g, '')
      .replace(/(<p>|<\/p>)+/g, m => m.length > 4 ? '<p>' : m);
  }

  async function openReadme() {
    document.getElementById('readme-bd').classList.add('open');
    document.getElementById('readme-sh').classList.add('open');
    document.body.style.overflow = 'hidden';
    const bodyEl = document.getElementById('readme-body');
    bodyEl.innerHTML = '<div class="loading">Loading…</div>';
    try {
      let md = null;
      try {
        const r = await fetch('./README.md');
        if (r.ok) md = await r.text();
      } catch(_) {}
      if (!md) {
        const fallback = githubRawUrl();
        if (!fallback) throw new Error('README could not be loaded');
        const r = await fetch(fallback);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        md = await r.text();
      }
      bodyEl.innerHTML = parseMarkdown(md);
    } catch(e) {
      bodyEl.innerHTML = `<div class="err">Could not load README.<br>${e.message}</div>`;
    }
  }

  function closeReadme() {
    document.getElementById('readme-bd').classList.remove('open');
    document.getElementById('readme-sh').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Self-rescheduling refresh: 30s live, 60s scheduled, 5 min off-day
  function scheduleRefresh() {
    const isLive    = !!document.querySelector('.b-live');
    const isPreview = !!document.querySelector('.b-preview');
    const delay = isLive ? 30_000 : isPreview ? 60_000 : 300_000;
    setTimeout(async () => { await load(); scheduleRefresh(); }, delay);
  }
  scheduleRefresh();

  load();
</script>
